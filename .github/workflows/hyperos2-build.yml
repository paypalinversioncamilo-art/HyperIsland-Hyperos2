name: HyperIsland HyperOS 2 APK

on:
  workflow_dispatch:
  push:
    branches: [main, master, 'hos2/**', 'hos3/**']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Android SDK
        shell: bash
        run: |
          set -eu
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -perm -u+x 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::No se encontró sdkmanager"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "build-tools;37.0.0" "ndk;28.2.13676358"
          PLATFORM_ZIP="$RUNNER_TEMP/platform-37.2_r01.zip"
          PLATFORM_TMP="$RUNNER_TEMP/android-platform-37.2"
          curl --fail --location --retry 3 --retry-delay 2 "https://dl.google.com/android/repository/platform-37.2_r01.zip" --output "$PLATFORM_ZIP"
          mkdir -p "$PLATFORM_TMP" "$ANDROID_HOME/platforms/android-37.2"
          unzip -q "$PLATFORM_ZIP" -d "$PLATFORM_TMP"
          PLATFORM_SOURCE="$(find "$PLATFORM_TMP" -type f -name source.properties -print -quit)"
          if [ -z "$PLATFORM_SOURCE" ]; then
            echo "::error::El paquete Android 37.2 no contiene source.properties"
            exit 1
          fi
          PLATFORM_DIR="$(dirname "$PLATFORM_SOURCE")"
          cp -R "$PLATFORM_DIR/." "$ANDROID_HOME/platforms/android-37.2/"
          test -f "$ANDROID_HOME/platforms/android-37.2/android.jar"

      - name: Preparar Gradle
        run: chmod +x android/gradlew

      - name: Compilar APK
        shell: bash
        run: |
          ./android/gradlew -p android --no-daemon :app:assembleReleaseFast \
            -PbuildTime="$(date -u '+%Y-%m-%d %H:%M UTC')" \
            -PappVersionName="3.3.3-hos2.${GITHUB_RUN_NUMBER}" \
            -PappVersionCode="$((2026112501 + GITHUB_RUN_NUMBER))"

      - name: Buscar APK
        shell: bash
        run: |
          set -euo pipefail
          echo "Buscando APK en el workspace de GitHub (incluye el buildDir externo configurado por Gradle):"
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          echo "RUNNER_WORKSPACE=$RUNNER_WORKSPACE"
          find "$RUNNER_WORKSPACE" -type f -name '*.apk' -print || true
          APK="$(find "$RUNNER_WORKSPACE" -type f -path '*/app/outputs/apk/releaseFast/*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            APK="$(find "$RUNNER_WORKSPACE" -type f -name '*.apk' -print -quit)"
          fi
          if [ -z "$APK" ]; then
            echo "::error::Gradle terminó, pero no se encontró ningún APK dentro de RUNNER_WORKSPACE"
            find "$RUNNER_WORKSPACE" -type d -path '*/outputs/*' -print || true
            exit 1
          fi
          mkdir -p dist
          cp "$APK" dist/HyperIsland-HyperOS2.apk
          test -s dist/HyperIsland-HyperOS2.apk
          unzip -t dist/HyperIsland-HyperOS2.apk >/dev/null
          unzip -l dist/HyperIsland-HyperOS2.apk | grep -q 'classes.dex'
          ls -lh dist/HyperIsland-HyperOS2.apk
          echo "APK validado desde: $APK"

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: HyperIsland-HyperOS2-APK
          path: dist/HyperIsland-HyperOS2.apk
          if-no-files-found: error
          retention-days: 30
